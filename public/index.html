<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glance Admin</title>
    <script>
      // Appliqué avant le premier rendu (pas de flash) : « system » = pas d'attribut.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Glance <span>Admin</span></h1>
      <nav>
        <button data-tab="monitors" class="active">Monitors</button>
        <button data-tab="yaml">Fichiers YAML</button>
      </nav>
      <small id="storage"></small>
      <div class="theme" id="theme" role="group" aria-label="Thème">
        <button data-theme-choice="light" title="Clair">☀ Clair</button>
        <button data-theme-choice="system" title="Suivre le système">Auto</button>
        <button data-theme-choice="dark" title="Sombre">☾ Sombre</button>
      </div>
    </header>
    <main>
      <section id="monitors"></section>
      <section id="yaml" hidden>
        <aside id="files"></aside>
        <div class="editor">
          <div class="bar">
            <strong id="filename">—</strong>
            <span id="status"></span>
            <button id="save" class="primary" disabled>Enregistrer (Ctrl+S)</button>
          </div>
          <textarea id="text" spellcheck="false" disabled></textarea>
        </div>
      </section>
    </main>
    <div id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
